<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenStudy 澄境 · 單人沉浸式讀書空間</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧘</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Ambient Dynamic Visual Layer -->
  <div id="bg-layer"></div>
  <div id="bg-overlay"></div>

  <!-- Zen Mode Floating Exit Trigger -->
  <button id="btn-zen-exit" class="glass-btn zen-exit-pill" title="退出極簡模式 (Esc / Z)">
    <span>✕ 退出極簡</span>
  </button>

  <!-- Main Application Container -->
  <div id="app">
    <!-- Top Navigation Bar -->
    <header class="top-bar">
      <div class="brand-section">
        <div class="brand-badge">
          <span class="brand-logo-icon">🧘</span>
          <span class="brand-title">ZenStudy 澄境</span>
          <span id="live-clock" class="brand-clock">12:00:00</span>
        </div>
      </div>

      <!-- Quick Scene Switcher Pills -->
      <nav id="quick-scenes" class="quick-scenes-bar" aria-label="場景快速選擇">
        <!-- Rendered dynamically -->
      </nav>

      <!-- Action Buttons -->
      <div class="top-actions">
        <button id="btn-zen-mode" class="glass-btn" title="切換極簡專注 (Z)">
          <span>👁️ 極簡專注</span>
        </button>
        <button id="btn-fullscreen" class="glass-btn glass-btn-icon-only" title="全螢幕 (F)">
          <span>⛶</span>
        </button>
        <button id="btn-open-tasks" class="glass-btn" title="專注任務清單">
          <span>📋 待辦目標</span>
        </button>
        <button id="btn-open-notes" class="glass-btn" title="靈感便籤">
          <span>📝 隨手便箋</span>
        </button>
        <button id="btn-open-scenes" class="glass-btn" title="場景管理與自訂">
          <span>🖼️ 場景庫</span>
        </button>
        <button id="btn-open-stats" class="glass-btn" title="專注統計與紀錄">
          <span>📊 數據統計</span>
        </button>
        <button id="btn-open-settings" class="glass-btn glass-btn-icon-only" title="設定">
          <span>⚙️</span>
        </button>
      </div>
    </header>

    <!-- Center Stage: Timer & Focus Anchor -->
    <main class="center-stage">
      <!-- Current Task Anchor -->
      <div id="active-task-pill" class="current-task-pill" title="點擊切換當前專注任務">
        <span class="task-badge-tag" id="active-task-tag">專案</span>
        <span id="active-task-title">閱讀商業設計概論第三章</span>
        <span class="task-pom-count" id="active-task-poms">🍅 1/3</span>
      </div>

      <!-- Primary Timer Container -->
      <div class="timer-container" id="timer-container">
        <!-- Mode Switcher -->
        <div class="timer-mode-tabs" role="tablist">
          <button class="mode-tab active" data-mode="pomodoro" id="mode-pomodoro">🍅 番茄鐘</button>
          <button class="mode-tab" data-mode="countdown" id="mode-countdown">⏳ 倒數計時</button>
          <button class="mode-tab" data-mode="stopwatch" id="mode-stopwatch">⏱️ 正數碼表</button>
        </div>

        <!-- Pomodoro Sub-stage Switcher -->
        <div class="stage-tabs" id="pomodoro-stage-tabs">
          <button class="stage-tab active" data-stage="work">專注 (25m)</button>
          <button class="stage-tab" data-stage="shortBreak">短休息 (5m)</button>
          <button class="stage-tab" data-stage="longBreak">長休息 (15m)</button>
        </div>

        <!-- Countdown Quick Presets (Shown only in countdown mode) -->
        <div class="stage-tabs" id="countdown-presets" style="display: none;">
          <button class="stage-tab" data-mins="15">15 分鐘</button>
          <button class="stage-tab active" data-mins="25">25 分鐘</button>
          <button class="stage-tab" data-mins="45">45 分鐘</button>
          <button class="stage-tab" data-mins="60">60 分鐘</button>
          <button class="stage-tab" data-mins="90">90 分鐘</button>
        </div>

        <!-- Sleek Circular Progress Ring & Digital Display -->
        <div class="display-wrapper">
          <svg class="progress-ring" viewBox="0 0 240 240">
            <circle class="progress-ring-circle-bg" cx="120" cy="120" r="105" />
            <circle class="progress-ring-circle" id="ring-circle" cx="120" cy="120" r="105" stroke-dasharray="659.73" stroke-dashoffset="0" />
          </svg>
          <div class="time-display">
            <span id="digital-time" class="digital-time">25:00</span>
            <span id="status-subtitle" class="status-subtitle">沉靜入定 · 專注心流</span>
          </div>
        </div>

        <!-- Action Controls -->
        <div class="timer-buttons">
          <button id="btn-timer-reset" class="btn-icon-action" title="重設時間">↺</button>
          <button id="btn-timer-toggle" class="btn-primary-action">開始專注</button>
          <button id="btn-timer-skip" class="btn-icon-action" title="跳過此回合">⏭</button>
        </div>
      </div>

      <!-- Motivational Quote -->
      <div class="quote-box">
        <span>“</span>
        <span class="quote-text" id="quote-text">專注不是一昧前進，而是懂得排除無關緊要的雜念。</span>
        <span class="quote-author" id="quote-author">— 沉思錄</span>
        <button id="btn-refresh-quote" class="quote-refresh-btn" title="更換名言">↻</button>
      </div>
    </main>

    <!-- Bottom Ambient Sound Mixer Dock -->
    <footer class="bottom-dock" id="sound-dock">
      <div class="mixer-quick-group" id="sound-chips-container">
        <!-- Ambient track chips injected via JS -->
      </div>

      <div class="dock-controls-group">
        <!-- Procedural Lofi Piano Toggle -->
        <button id="btn-toggle-lofi" class="glass-btn" title="暖心 Lo-Fi 和弦生成">
          <span>🎵 暖光 Lofi</span>
        </button>

        <!-- Master Mute Toggle -->
        <button id="btn-mute-toggle" class="glass-btn glass-btn-icon-only" title="一鍵靜音 (M)">
          <span id="mute-icon">🔊</span>
        </button>

        <!-- Master Volume -->
        <div class="sound-chip" title="主音量">
          <span>🎚️</span>
          <input type="range" id="master-volume-slider" min="0" max="1" step="0.01" value="0.85">
        </div>

        <!-- Ambience Dimmer & Blur -->
        <div class="sound-chip" title="背景亮度">
          <span>🔆</span>
          <input type="range" id="bg-brightness-slider" min="20" max="100" step="5" value="65">
        </div>
        <div class="sound-chip" title="背景模糊">
          <span>🌫️</span>
          <input type="range" id="bg-blur-slider" min="0" max="16" step="1" value="0">
        </div>
      </div>
    </footer>
  </div>

  <!-- Shared Drawer Backdrop -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>

  <!-- Drawer 1: Tasks / Goals (CRUD) -->
  <aside id="drawer-tasks" class="slide-drawer" aria-labelledby="tasks-title">
    <div class="drawer-header">
      <h2 id="tasks-title" class="drawer-title"><span>📋</span> 專注任務與目標管理</h2>
      <button class="drawer-close-btn" data-close="drawer-tasks">✕</button>
    </div>
    <div class="drawer-body">
      <!-- Add Task Form -->
      <form id="form-add-task" class="input-group">
        <label class="input-label" for="task-input-title">新增待辦任務</label>
        <div style="display: flex; gap: 0.5rem;">
          <input type="text" id="task-input-title" class="text-input" placeholder="例如：完成期末簡報第 3 頁" required>
          <select id="task-input-tag" class="text-input" style="width: 100px;">
            <option value="課程">課程</option>
            <option value="專案">專案</option>
            <option value="閱讀">閱讀</option>
            <option value="日常">日常</option>
          </select>
          <input type="number" id="task-input-poms" class="text-input" style="width: 70px;" value="1" min="1" max="10" title="預估番茄數">
          <button type="submit" class="glass-btn" style="background: var(--text-main); color: #000; font-weight: 700;">＋</button>
        </div>
      </form>

      <!-- Task Filter Pills -->
      <div class="stage-tabs" id="task-filters">
        <button class="stage-tab active" data-filter="all">全部</button>
        <button class="stage-tab" data-filter="active">進行中</button>
        <button class="stage-tab" data-filter="completed">已完成</button>
      </div>

      <!-- Task List Container -->
      <div id="tasks-list" class="task-list" style="display: flex; flex-direction: column; gap: 0.6rem;">
        <!-- Injected via JS -->
      </div>
    </div>
  </aside>

  <!-- Drawer 2: Notes / Memos (CRUD) -->
  <aside id="drawer-notes" class="slide-drawer" aria-labelledby="notes-title">
    <div class="drawer-header">
      <h2 id="notes-title" class="drawer-title"><span>📝</span> 沉浸隨手筆記便箋</h2>
      <button class="drawer-close-btn" data-close="drawer-notes">✕</button>
    </div>
    <div class="drawer-body">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="input-label">及時記錄靈感，即刻自動保存</span>
        <button id="btn-add-note" class="glass-btn" style="background: var(--accent-warm); color: #000; font-weight: 700;">＋ 新增便箋</button>
      </div>
      <div id="notes-container" class="notes-grid">
        <!-- Injected via JS -->
      </div>
    </div>
  </aside>

  <!-- Drawer 3: Scenes Library & Custom Scenes (CRUD) -->
  <aside id="drawer-scenes" class="slide-drawer" aria-labelledby="scenes-title">
    <div class="drawer-header">
      <h2 id="scenes-title" class="drawer-title"><span>🖼️</span> 沉浸場景庫與自訂管理</h2>
      <button class="drawer-close-btn" data-close="drawer-scenes">✕</button>
    </div>
    <div class="drawer-body">
      <!-- Add Custom Scene Form -->
      <details style="background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass-subtle); border-radius: var(--radius-md); padding: 0.8rem;">
        <summary style="cursor: pointer; font-weight: 600; font-size: 0.88rem; color: var(--accent-primary);">＋ 新增個人自訂場景 (圖片 / 動態網址)</summary>
        <form id="form-add-scene" class="input-group" style="margin-top: 0.8rem; gap: 0.6rem;">
          <input type="text" id="scene-input-name" class="text-input" placeholder="場景名稱 (如: 台北雨夜)" required>
          <input type="url" id="scene-input-url" class="text-input" placeholder="圖片或動態桌布 URL (Unsplash 等)" required>
          <input type="text" id="scene-input-cat" class="text-input" placeholder="分類標籤 (預設: 個人自訂)">
          <button type="submit" class="glass-btn" style="background: var(--accent-primary); color: #000; font-weight: 700; width: 100%;">確認儲存至場景庫</button>
        </form>
      </details>

      <span class="input-label" style="margin-top: 0.5rem;">內建精選場景</span>
      <div id="scenes-grid" class="scenes-grid">
        <!-- Injected via JS -->
      </div>

      <span class="input-label" style="margin-top: 0.8rem;">個人自訂場景</span>
      <div id="custom-scenes-grid" class="scenes-grid">
        <!-- Injected via JS -->
      </div>
    </div>
  </aside>

  <!-- Drawer 4: Analytics, History & Data Backup (CRUD) -->
  <aside id="drawer-stats" class="slide-drawer" aria-labelledby="stats-title">
    <div class="drawer-header">
      <h2 id="stats-title" class="drawer-title"><span>📊</span> 專注數據統計與備份</h2>
      <button class="drawer-close-btn" data-close="drawer-stats">✕</button>
    </div>
    <div class="drawer-body">
      <!-- Stat Metric Cards -->
      <div class="stats-cards-grid">
        <div class="stat-card">
          <span class="stat-val" id="stat-today-mins">0</span>
          <span class="stat-label">今日專注 (分鐘)</span>
        </div>
        <div class="stat-card">
          <span class="stat-val" id="stat-total-poms">0</span>
          <span class="stat-label">完成番茄數 (顆)</span>
        </div>
        <div class="stat-card">
          <span class="stat-val" id="stat-total-mins">0</span>
          <span class="stat-label">累積總專注 (分鐘)</span>
        </div>
        <div class="stat-card">
          <span class="stat-val" id="stat-total-sessions">0</span>
          <span class="stat-label">累計學習回合</span>
        </div>
      </div>

      <!-- History Table -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">
        <span class="input-label">專注歷史紀錄 (可單筆刪除)</span>
        <button id="btn-clear-history" style="font-size: 0.72rem; color: var(--accent-rose); text-decoration: underline;">清空紀錄</button>
      </div>
      <div id="history-list" class="history-list">
        <!-- Injected via JS -->
      </div>

      <!-- JSON Backup Export & Import (滿足加分項資料保存與管理要求) -->
      <div class="input-group" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-glass-subtle);">
        <span class="input-label">資料備份與匯出 (JSON)</span>
        <div style="display: flex; gap: 0.6rem;">
          <button id="btn-export-backup" class="glass-btn" style="flex: 1;">📥 匯出完整 JSON 備份</button>
          <label class="glass-btn" style="flex: 1; text-align: center; cursor: pointer;">
            📤 匯入 JSON 備份
            <input type="file" id="file-import-backup" accept=".json" style="display: none;">
          </label>
        </div>
      </div>
    </div>
  </aside>

  <!-- Drawer 5: Settings -->
  <aside id="drawer-settings" class="slide-drawer" aria-labelledby="settings-title">
    <div class="drawer-header">
      <h2 id="settings-title" class="drawer-title"><span>⚙️</span> 偏好設定</h2>
      <button class="drawer-close-btn" data-close="drawer-settings">✕</button>
    </div>
    <div class="drawer-body">
      <div class="input-group">
        <label class="input-label">番茄鐘專注時長 (分鐘)</label>
        <input type="number" id="setting-work-time" class="text-input" min="1" max="120" value="25">
      </div>
      <div class="input-group">
        <label class="input-label">短休息時長 (分鐘)</label>
        <input type="number" id="setting-short-break" class="text-input" min="1" max="60" value="5">
      </div>
      <div class="input-group">
        <label class="input-label">長休息時長 (分鐘)</label>
        <input type="number" id="setting-long-break" class="text-input" min="1" max="90" value="15">
      </div>

      <div class="input-group" style="margin-top: 0.5rem;">
        <label class="input-label">計時結束提示音效</label>
        <div style="display: flex; gap: 0.5rem;">
          <select id="setting-alarm-sound" class="text-input" style="flex: 1;">
            <option value="singing-bowl">西藏頌缽 (Singing Bowl - 沉靜冥想)</option>
            <option value="soft-bell">柔和禪鐘 (Soft Meditation Chime)</option>
            <option value="digital-triad">明亮三音階 (Ascending Triad)</option>
          </select>
          <button id="btn-test-chime" class="glass-btn" title="試聽音效">🔔 試聽</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 0.8rem; margin-top: 0.8rem;">
        <label style="display: flex; align-items: center; gap: 0.6rem; font-size: 0.86rem; cursor: pointer;">
          <input type="checkbox" id="setting-auto-breaks" class="task-checkbox">
          <span>專注完成後自動進入休息</span>
        </label>
        <label style="display: flex; align-items: center; gap: 0.6rem; font-size: 0.86rem; cursor: pointer;">
          <input type="checkbox" id="setting-auto-pomodoro" class="task-checkbox">
          <span>休息結束後自動開始下一個番茄</span>
        </label>
      </div>

      <button id="btn-save-settings" class="glass-btn" style="background: var(--text-main); color: #000; font-weight: 700; margin-top: 1rem;">儲存設定</button>
    </div>
  </aside>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Main JavaScript App Entry (Universal scripts supporting direct double-click file:// opening & Vercel deployment) -->
  <script src="js/storage.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
